services:
  - type: web
    name: cleusforge-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL_FAST
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: OPENAI_MODEL_SMARTEST
        value: deepseek/deepseek-r1:free
      - key: OPENAI_MODEL_CODING
        value: qwen/qwen-2.5-coder-32b-instruct:free
      - key: OPENAI_MODEL_AGENT
        value: dolphin-mistral-24b-venice-edition
